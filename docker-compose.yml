services:
  apiservice:
    build:
      context: .
      dockerfile: AILearningPlatform.ApiServer/Dockerfile
    environment:
      ConnectionStrings__sqldata: "Data Source=/data/sqldata.db"
    volumes:
      - sqldata:/data
    restart: unless-stopped

  evaluationworker:
    build:
      context: .
      dockerfile: AILearningPlatform.EvaluationWorker/Dockerfile
    environment:
      ConnectionStrings__sqldata: "Data Source=/data/sqldata.db"
    volumes:
      - sqldata:/data
    depends_on:
      - apiservice
    restart: unless-stopped

  frontend:
    build:
      context: ./AILearningPlatform.Frontend
      dockerfile: Dockerfile
    environment:
      API_URL: ${FRONTEND_API_URL:-}
    depends_on:
      - apiservice
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  sqldata:
